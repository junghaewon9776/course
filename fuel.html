<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>⛽ 기름값 정산</title>
  <link rel="stylesheet" href="style.css?v=20260611b">
  <style>
    .fuel-tbl { width:100%; border-collapse:collapse; font-size:12px; }
    .fuel-tbl th, .fuel-tbl td { border:1px solid #e0e0e0; padding:5px 6px; text-align:right; white-space:nowrap; }
    .fuel-tbl th { background:#f3eefa; text-align:center; position:sticky; top:0; z-index:1; }
    .fuel-tbl td.l { text-align:left; }
    .fuel-tbl input { width:80px; text-align:right; padding:3px 4px; }
    .fuel-tbl input.lit { width:60px; }
    .fuel-wrap { overflow:auto; max-height:62vh; }
    .sumbox { display:flex; flex-wrap:wrap; gap:10px; }
    .sumcard { flex:1; min-width:140px; background:#fff; border:1px solid #e5e7eb; border-radius:10px; padding:10px 12px; }
    .sumcard .lab { font-size:11px; color:#888; }
    .sumcard .val { font-size:18px; font-weight:800; color:#2c3e50; }
    .price-row { display:flex; align-items:center; gap:8px; margin:5px 0; flex-wrap:wrap; }
    .price-row input { width:110px; }
    .grp-d { background:#fff8ec; } .grp-g { background:#eefaf0; }
    .mon-tbl { width:100%; border-collapse:collapse; font-size:13px; }
    .mon-tbl th, .mon-tbl td { border:1px solid #e0e0e0; padding:6px 8px; text-align:right; }
    .mon-tbl th { background:#eef3fb; text-align:center; }
    @media print { header, nav, .no-print { display:none !important; } .fuel-wrap { max-height:none; overflow:visible; } }
  </style>
</head>
<body>
<header>
  <h1>⛽ 기름값 정산 <span style="font-size:13px;font-weight:400;color:#e74c3c;">(예상·제출용 · 관리자)</span></h1>
  <nav>
    <a href="index.html">홈</a>
    <a href="admin.html">관리</a>
    <a href="members.html">인원</a>
    <a href="today.html">오늘운영</a>
    <a href="monitor.html">모니터링</a>
    <a href="monitor.html?logs=1">운행기록</a>
    <a href="stats.html">통계</a>
    <a href="fuel.html" class="active">기름정산</a>
    <a href="#" onclick="adminLogout();return false;">로그아웃</a>
  </nav>
</header>

<div class="container">
  <!-- 설정 -->
  <div class="card no-print">
    <h2>⚙️ 설정</h2>
    <div class="price-row">
      <label style="margin:0;">기간</label>
      <input type="date" id="fFrom" onchange="saveCfgFromUI();renderFuel()">
      <span>~</span>
      <input type="date" id="fTo" onchange="saveCfgFromUI();renderFuel()">
    </div>
    <div class="price-row">
      <label style="margin:0;">예산 (원)</label>
      <input type="text" inputmode="numeric" id="fBudget" placeholder="9,600,000" onchange="saveCfgFromUI();renderRunOnly()">
    </div>
    <div class="price-row">
      <label style="margin:0;">운행당 기본금액</label>
      경유 <input type="text" inputmode="numeric" id="fDefD" placeholder="200,000" onchange="saveCfgFromUI();renderRunOnly()" style="width:110px;">
      휘발유 <input type="text" inputmode="numeric" id="fDefG" placeholder="17,000" onchange="saveCfgFromUI();renderRunOnly()" style="width:110px;">
      <button class="small gray" onclick="resetAmts()">↺ 전부 기본값으로</button>
    </div>
    <div style="margin-top:10px;">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px;">
        <div style="font-weight:700;color:#2c3e50;">📅 월별 평균 단가 (원/L) — 오피넷 평균 + α</div>
        <button class="small" style="background:#2980b9;color:#fff;" onclick="fillDefaultPrices()">🔄 기본 시세 채우기</button>
        <a href="https://www.opinet.co.kr/user/dopospdrg/dopOsPdrgSelect.do" target="_blank" style="font-size:12px;color:#2980b9;">오피넷 시세 ↗</a>
      </div>
      <div id="priceTable"></div>
      <p class="muted" style="font-size:11px;margin-top:4px;">※ 월별은 <b>기본값</b>이에요. 아래 표에서 <b>운행 하나하나 단가·금액·리터를 직접 바꿀 수</b> 있어요. 바꾼 건 저장돼요.</p>
    </div>
  </div>

  <!-- 월별 마감 -->
  <div class="card">
    <h2>📅 월별 마감</h2>
    <div style="overflow-x:auto;"><table class="mon-tbl" id="monTable"></table></div>
  </div>

  <!-- 요약 -->
  <div class="card">
    <h2>📊 전체 요약</h2>
    <div class="sumbox" id="fuelSummary"></div>
    <div style="margin-top:10px;" class="no-print">
      <button class="small" style="background:#2e7d32;color:#fff;" onclick="downloadCsv()">📥 엑셀(CSV) 다운로드 (제출양식)</button>
      <button class="small" style="background:#34495e;color:#fff;" onclick="window.print()">🖨 인쇄</button>
    </div>
  </div>

  <!-- 운행별 상세 -->
  <div class="card">
    <h2>🚐 운행별 상세 <span id="fuelCount" class="muted"></span></h2>
    <div class="fuel-wrap">
      <table class="fuel-tbl" id="fuelTable"></table>
    </div>
    <p class="muted" style="font-size:11px;margin-top:6px;">※ <b>단가·금액·리터 모두 직접 수정</b> 가능. 금액 넣으면 리터 자동 / 리터 넣으면 금액 자동 (그 줄 단가 기준). 경유=기름통, 휘발유=기계.</p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="firebase-config.js?v=20260513t"></script>
<script src="common.js?v=20260720a"></script>
<script>
let __fuelRuns = [];
let __fuelCloudT = null;

function num(v) { return parseInt(String(v == null ? '' : v).replace(/[^0-9.-]/g, ''), 10) || 0; }
function fnum(v) { const f = parseFloat(String(v == null ? '' : v).replace(/[^0-9.-]/g, '')); return isNaN(f) ? 0 : f; }
function comma(n) { return (Math.round(n || 0)).toLocaleString('ko-KR'); }

function loadFuelCfg() {
  let c = {};
  try { c = JSON.parse(localStorage.getItem('__fuelCfg') || '{}'); } catch (e) {}
  try {
    const fc = (typeof _cache !== 'undefined' && _cache && _cache.fuelConfig) || null;
    if (fc && (Number(fc.__t) || 0) >= (Number(c.__t) || 0)) c = fc;   // 클라우드가 최신이면 사용
  } catch (e) {}
  const yr = new Date().getFullYear();
  return {
    __t: c.__t || 0,
    from: c.from || (yr + '-06-01'),
    to: c.to || (yr + '-10-31'),
    budget: c.budget || 9600000,
    defD: (c.defD != null ? c.defD : 200000),
    defG: (c.defG != null ? c.defG : 17000),
    prices: c.prices || {},   // {'2026-6':{d,g}}
    amts: c.amts || {}        // {logKey:{d,g,pd,pg}}  운행별 금액·단가(수정분)
  };
}
function saveFuelCfg(c) {
  c.__t = Date.now();
  try { localStorage.setItem('__fuelCfg', JSON.stringify(c)); } catch (e) {}
  clearTimeout(__fuelCloudT);
  __fuelCloudT = setTimeout(function () { try { if (typeof fbDb !== 'undefined') fbDb.ref('/fuelConfig').set(c); } catch (e) {} }, 1500);
}
function saveCfgFromUI() {
  const c = loadFuelCfg();
  c.from = document.getElementById('fFrom').value || c.from;
  c.to = document.getElementById('fTo').value || c.to;
  c.budget = num(document.getElementById('fBudget').value) || c.budget;
  const dd = num(document.getElementById('fDefD').value); c.defD = dd || 200000;
  const dg = num(document.getElementById('fDefG').value); c.defG = dg || 17000;
  saveFuelCfg(c);
}
function setPrice(ym, kind, val) {
  const c = loadFuelCfg();
  if (!c.prices[ym]) c.prices[ym] = { d: 0, g: 0 };
  c.prices[ym][kind] = num(val);
  saveFuelCfg(c);
  renderRunOnly();   // 월별표는 다시 안 그림(포커스 유지)
}
// 운행별: field 'price'(단가) / 'amt'(금액) / 'lit'(리터→금액 역산). kind 'd'|'g'
function setRun(key, kind, field, val, price) {
  const c = loadFuelCfg();
  if (!c.amts[key]) c.amts[key] = {};
  if (field === 'price') c.amts[key]['p' + kind] = num(val);
  else if (field === 'lit') c.amts[key][kind] = Math.round(fnum(val) * (price || 0));
  else c.amts[key][kind] = num(val);
  saveFuelCfg(c);
  renderRunOnly();
}
function resetAmts() {
  if (!confirm('모든 운행의 단가·금액을 기본값으로 되돌릴까요? (직접 수정한 값 사라짐)')) return;
  const c = loadFuelCfg(); c.amts = {}; saveFuelCfg(c); renderRunOnly();
}
function fillDefaultPrices() {
  const c = loadFuelCfg();
  const months = monthsBetween(c.from, c.to);
  if (!months.length) { alert('기간을 먼저 정하세요.'); return; }
  let filled = 0;
  months.forEach(ym => {
    if (!c.prices[ym]) c.prices[ym] = { d: 0, g: 0 };
    if (!c.prices[ym].d) { c.prices[ym].d = 1600; filled++; }
    if (!c.prices[ym].g) { c.prices[ym].g = 1700; filled++; }
  });
  saveFuelCfg(c); renderFuel();
  alert(filled ? (filled + '칸을 기본 시세(경유 1,600 / 휘발유 1,700)로 채웠어요. 실제 월평균으로 조정하세요.') : '이미 월별 단가가 다 입력돼 있어요. 표에서 직접 수정하세요.');
}
function trackKm(t) { if (!Array.isArray(t) || t.length < 2) return 0; let d = 0; for (let i = 1; i < t.length; i++) d += distance(t[i-1][0], t[i-1][1], t[i][0], t[i][1]); return d / 1000; }
function courseNo(name) { const m = String(name || '').match(/(\d+)/); return m ? parseInt(m[1], 10) : 0; }
function monthsBetween(from, to) {
  const out = []; const a = new Date(from + 'T00:00:00'), b = new Date(to + 'T00:00:00');
  if (isNaN(a) || isNaN(b)) return out;
  let y = a.getFullYear(), m = a.getMonth();
  while (y < b.getFullYear() || (y === b.getFullYear() && m <= b.getMonth())) { out.push(y + '-' + (m + 1)); m++; if (m > 11) { m = 0; y++; } }
  return out;
}
function escF(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

function renderPriceTable(cfg) {
  const el = document.getElementById('priceTable');
  const months = monthsBetween(cfg.from, cfg.to);
  if (!months.length) { el.innerHTML = '<span style="color:#aaa;">기간을 정하세요</span>'; return; }
  el.innerHTML = months.map(ym => {
    const p = cfg.prices[ym] || { d: '', g: '' };
    const [y, m] = ym.split('-');
    return `<div class="price-row" style="border-bottom:1px dashed #eee;padding-bottom:5px;">
      <span style="width:64px;font-weight:700;">${y}.${m}월</span>
      <label style="margin:0;font-size:12px;">경유</label>
      <input type="number" step="1" value="${p.d || ''}" placeholder="1600" oninput="setPrice('${ym}','d',this.value)">
      <label style="margin:0;font-size:12px;">휘발유</label>
      <input type="number" step="1" value="${p.g || ''}" placeholder="1700" oninput="setPrice('${ym}','g',this.value)">
    </div>`;
  }).join('');
}

function collectRuns(cfg) {
  const data = loadData();
  const fromMs = new Date(cfg.from + 'T00:00:00').getTime();
  const toMs = new Date(cfg.to + 'T23:59:59').getTime();
  return (data.logs || [])
    .filter(l => (typeof isRunLog === 'function' ? isRunLog(l) : (l && l.startedAt)) && !l.hidden && l.finishedAt)
    .filter(l => { const t = l.startedAt || l.finishedAt || 0; return t >= fromMs && t <= toMs; })
    .sort((a, b) => (a.startedAt || a.finishedAt || 0) - (b.startedAt || b.finishedAt || 0))
    .map(l => {
      const t = l.startedAt || l.finishedAt || 0; const d = new Date(t);
      const ym = d.getFullYear() + '-' + (d.getMonth() + 1);
      const co = (typeof getCourse === 'function' && getCourse(data, l.courseId)) || {};
      const ev = (typeof getEvent === 'function' && getEvent(data, l.eventId)) || {};
      const team = (typeof getTeam === 'function' && getTeam(data, l.teamId)) || {};
      const mp = cfg.prices[ym] || { d: 0, g: 0 };
      const am = cfg.amts[l.key] || {};
      const pD = am.pd != null ? am.pd : (mp.d || 0);   // 단가: 운행 수정값 우선, 없으면 그 달 값
      const pG = am.pg != null ? am.pg : (mp.g || 0);
      const amtD = am.d != null ? am.d : cfg.defD;       // 금액: 운행 수정값 우선, 없으면 기본금액
      const amtG = am.g != null ? am.g : cfg.defG;
      return {
        key: l.key || (t + ''), t, mon: d.getMonth() + 1, ym,
        dateStr: `${d.getMonth() + 1}/${d.getDate()}`,
        ev: ev.name || '', co: co.name || '', cno: courseNo(co.name),
        jo: team.name || '', driver: (l.crew && l.crew.driver) || '', assist: (l.crew && l.crew.assist) || '',
        pD, pG, amtD, amtG,
        litD: pD ? amtD / pD : 0, litG: pG ? amtG / pG : 0
      };
    });
}

function renderFuel() {
  const cfg = loadFuelCfg();
  document.getElementById('fFrom').value = cfg.from;
  document.getElementById('fTo').value = cfg.to;
  document.getElementById('fBudget').value = comma(cfg.budget);
  document.getElementById('fDefD').value = comma(cfg.defD);
  document.getElementById('fDefG').value = comma(cfg.defG);
  renderPriceTable(cfg);
  renderRunOnly(cfg);
}
function renderRunOnly(cfg) {
  cfg = cfg || loadFuelCfg();
  const runs = collectRuns(cfg);
  __fuelRuns = runs;
  let totD = 0, totG = 0, totLD = 0, totLG = 0;
  const byMon = {};
  runs.forEach(r => {
    totD += r.amtD; totG += r.amtG; totLD += r.litD; totLG += r.litG;
    if (!byMon[r.mon]) byMon[r.mon] = { cnt: 0, d: 0, g: 0, ld: 0, lg: 0 };
    const b = byMon[r.mon]; b.cnt++; b.d += r.amtD; b.g += r.amtG; b.ld += r.litD; b.lg += r.litG;
  });

  // 월별 마감
  const monEl = document.getElementById('monTable');
  const mons = Object.keys(byMon).map(Number).sort((a, b) => a - b);
  monEl.innerHTML = `<thead><tr><th>월</th><th>건수</th><th>경유 리터</th><th>경유 금액</th><th>휘발유 리터</th><th>휘발유 금액</th><th>합계금액</th></tr></thead><tbody>` +
    (mons.length ? mons.map(m => { const b = byMon[m]; return `<tr>
      <td style="text-align:center;font-weight:700;">${m}월</td>
      <td>${b.cnt}건</td>
      <td>${b.ld.toFixed(1)}L</td><td>${comma(b.d)}원</td>
      <td>${b.lg.toFixed(1)}L</td><td>${comma(b.g)}원</td>
      <td style="font-weight:700;">${comma(b.d + b.g)}원</td>
    </tr>`; }).join('') : '<tr><td colspan="7" style="text-align:center;color:#aaa;padding:16px;">데이터 없음</td></tr>') +
    `</tbody><tfoot><tr style="font-weight:800;background:#eef3fb;">
      <td style="text-align:center;">합계</td><td>${runs.length}건</td>
      <td>${totLD.toFixed(1)}L</td><td>${comma(totD)}원</td>
      <td>${totLG.toFixed(1)}L</td><td>${comma(totG)}원</td>
      <td>${comma(totD + totG)}원</td>
    </tr></tfoot>`;

  // 운행별 상세
  document.getElementById('fuelCount').textContent = `(${runs.length}건)`;
  const tbl = document.getElementById('fuelTable');
  tbl.innerHTML = `<thead><tr>
      <th>날짜</th><th>행사·코스</th><th>조</th><th>운전/보조</th>
      <th class="grp-d">경유단가</th><th class="grp-d">경유리터</th><th class="grp-d">경유금액</th>
      <th class="grp-g">휘발유단가</th><th class="grp-g">휘발유리터</th><th class="grp-g">휘발유금액</th>
    </tr></thead><tbody>` +
    (runs.length ? runs.map(r => `<tr>
      <td>${r.dateStr}</td>
      <td class="l">${escF(r.ev)}${r.co ? ' · ' + escF(r.co) : ''}</td>
      <td>${escF(r.jo)}</td>
      <td class="l">${escF(r.driver)}${r.assist ? '/' + escF(r.assist) : ''}</td>
      <td class="grp-d"><input type="text" inputmode="numeric" value="${comma(r.pD)}" onchange="setRun('${r.key}','d','price',this.value,0)"></td>
      <td class="grp-d"><input class="lit" type="number" step="0.1" value="${r.litD ? r.litD.toFixed(1) : ''}" onchange="setRun('${r.key}','d','lit',this.value,${r.pD})"></td>
      <td class="grp-d"><input type="text" inputmode="numeric" value="${comma(r.amtD)}" onchange="setRun('${r.key}','d','amt',this.value,0)"></td>
      <td class="grp-g"><input type="text" inputmode="numeric" value="${comma(r.pG)}" onchange="setRun('${r.key}','g','price',this.value,0)"></td>
      <td class="grp-g"><input class="lit" type="number" step="0.1" value="${r.litG ? r.litG.toFixed(1) : ''}" onchange="setRun('${r.key}','g','lit',this.value,${r.pG})"></td>
      <td class="grp-g"><input type="text" inputmode="numeric" value="${comma(r.amtG)}" onchange="setRun('${r.key}','g','amt',this.value,0)"></td>
    </tr>`).join('') : '<tr><td colspan="10" style="text-align:center;color:#aaa;padding:20px;">이 기간에 운행기록이 없습니다</td></tr>') +
    `</tbody><tfoot><tr style="font-weight:800;background:#faf7ff;">
      <td colspan="4">합계 ${runs.length}건</td>
      <td class="grp-d">-</td><td class="grp-d">${totLD.toFixed(1)}L</td><td class="grp-d">${comma(totD)}원</td>
      <td class="grp-g">-</td><td class="grp-g">${totLG.toFixed(1)}L</td><td class="grp-g">${comma(totG)}원</td>
    </tr></tfoot>`;

  // 전체 요약
  const grand = totD + totG, budget = cfg.budget || 0, diff = grand - budget;
  const diffTxt = diff === 0 ? '<b>딱 맞음</b>' : (diff > 0 ? `예산보다 <b style="color:#e74c3c;">+${comma(diff)}원</b> 초과` : `예산보다 <b style="color:#2980b9;">${comma(-diff)}원</b> 남음`);
  document.getElementById('fuelSummary').innerHTML = `
    <div class="sumcard" style="border-color:#f39c12;"><div class="lab">경유 합계</div><div class="val">${comma(totD)}원</div><div style="font-size:11px;color:#888;">${totLD.toFixed(0)}L</div></div>
    <div class="sumcard" style="border-color:#27ae60;"><div class="lab">휘발유 합계</div><div class="val">${comma(totG)}원</div><div style="font-size:11px;color:#888;">${totLG.toFixed(0)}L</div></div>
    <div class="sumcard" style="border-color:#8e44ad;"><div class="lab">총 합계</div><div class="val">${comma(grand)}원</div></div>
    <div class="sumcard"><div class="lab">예산 ${comma(budget)}원 대비</div><div class="val" style="font-size:14px;">${diffTxt}</div></div>
  `;
}

// 📥 제출양식 CSV — 운행 1건 = 경유·휘발유 2줄
function downloadCsv() {
  const cfg = loadFuelCfg();
  const head = ['월', '일자', '방역자', '조', '1코스', '2코스', '3코스', '총계', '유종', '단가', '리터', '금액'];
  const lines = [head.join(',')];
  let lastMon = '', totD = 0, totG = 0;
  __fuelRuns.forEach(r => {
    totD += r.amtD; totG += r.amtG;
    const monCell = (r.mon !== lastMon) ? (r.mon + '월') : ''; lastMon = r.mon;
    const c1 = r.cno === 1 ? 1 : '', c2 = r.cno === 2 ? 1 : '', c3 = r.cno === 3 ? 1 : '';
    lines.push([monCell, csvS(r.dateStr), csvS(r.driver), csvS(r.jo), c1, c2, c3, 1, '경유', Math.round(r.pD), r.litD.toFixed(1), Math.round(r.amtD)].join(','));
    lines.push(['', '', csvS(r.assist), csvS(r.jo), c1, c2, c3, 1, '휘발유', Math.round(r.pG), r.litG.toFixed(1), Math.round(r.amtG)].join(','));
  });
  lines.push([]);
  lines.push(['합계금액', '', '', '', '', '', '', '', '', '', '', Math.round(totD + totG)].join(','));
  lines.push(['경유합계', '', '', '', '', '', '', '', '', '', '', Math.round(totD)].join(','));
  lines.push(['휘발유합계', '', '', '', '', '', '', '', '', '', '', Math.round(totG)].join(','));
  const csv = '﻿' + lines.join('\r\n');
  try {
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `유류비내역서_${cfg.from}_${cfg.to}.csv`;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  } catch (e) { alert('다운로드 실패: ' + e.message); }
}
function csvS(s) { s = String(s || ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }

checkAdminAuth().then(ok => { if (ok) onDataReady(renderFuel); });
</script>
